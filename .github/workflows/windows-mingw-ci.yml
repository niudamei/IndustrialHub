name: Windows MinGW CI

on:
  push:
    branches:
      - main
      - fix/simulated-communication-validation
  pull_request:
    branches:
      - main
      - fix/simulated-communication-validation

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.10.3 MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtcharts qtserialport
          tools: tools_cmake,tools_ninja
          tools_mingw: 13.1.0

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package
