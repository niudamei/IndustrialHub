name: Windows MinGW CI

on:
  push:
    branches:
      - main
      - fix/simulated-communication-validation
  pull_request:
    branches:
      - main
      - fix/simulated-communication-validation

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.10.3 MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtcharts qtserialport qtserialbus
          tools: tools_mingw1310,qt.tools.win64_mingw1310

      - name: Configure
        shell: pwsh
        run: |
          $toolsRoot = $env:IQTA_TOOLS
          if ([string]::IsNullOrWhiteSpace($toolsRoot)) {
            $toolsRoot = Join-Path $env:GITHUB_WORKSPACE "Qt\Tools"
          }
          $mingwBin = Join-Path $toolsRoot "mingw1310_64\bin"
          if (-not (Test-Path (Join-Path $mingwBin "g++.exe"))) {
            throw "Qt 6.10.3 MinGW 13.1.0 compiler not found: $mingwBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          $env:PATH = "$mingwBin;$env:PATH"
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package
